<form method="POST" action="{{ form_action }}" >  
  {% csrf_token %}
  <input
    id="id_text"
    name="text"
    class="form-control
           form-control-lg
           {% if form.errors %}is-invalid{% endif %}"
    placeholder="{% if user.is_authenticated %}Enter a to-do item{% else %}Log in to start a new list{% endif %}"
    value="{{ form.text.value }}"
    aria-describedby="id_text_feedback"
    required
    {% if not user.is_authenticated %}disabled{% endif %}
  />
  {% if form.errors %}
    <div id="id_text_feedback" class="invalid-feedback">
      {{ form.errors.text.0 }}
    </div>
  {% endif %}
</form>
